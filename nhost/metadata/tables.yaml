version: 3
sources:
  - name: default
    kind: postgres
    tables:
      # ─────────────────────────────────────────────────────────────
      # ORGANIZATIONS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: organizations
        array_relationships:
          - name: org_members
            using:
              foreign_key_constraint_on:
                column: org_id
                table:
                  schema: public
                  name: org_members
          - name: workflows
            using:
              foreign_key_constraint_on:
                column: org_id
                table:
                  schema: public
                  name: workflows
          - name: risk_assessments
            using:
              foreign_key_constraint_on:
                column: org_id
                table:
                  schema: public
                  name: risk_assessments
        # Expose org_usage_this_month view through relationship
        select_permissions:
          - role: user
            permission:
              columns: "*"
              filter:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - role: owner
            permission:
              columns: [id, name, slug, quota_calls_allowed, quota_calls_used, quota_calls_pending, quota_reset_at, created_at]
              filter:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          - role: editor
            permission:
              columns: [id, name, slug, quota_calls_allowed, quota_calls_used, quota_calls_pending, quota_reset_at, created_at]
              filter:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: [id, name, slug, quota_calls_allowed, quota_calls_used, quota_calls_pending, quota_reset_at, created_at]
              filter:
                org_members:
                  user_id: { _eq: X-Hasura-User-Id }

      # ─────────────────────────────────────────────────────────────
      # ORG MEMBERS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: org_members
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
          - name: user
            using:
              foreign_key_constraint_on: user_id
        select_permissions:
          - role: user
            permission:
              columns: "*"
              filter:
                user_id:
                  _eq: X-Hasura-User-Id
          # Simplified: user can see members of their own org
          - role: owner
            permission:
              columns: [id, org_id, user_id, role, created_at]
              filter:
                organization:
                  org_members:
                    user_id: { _eq: X-Hasura-User-Id }
          - role: editor
            permission:
              columns: [id, org_id, user_id, role, created_at]
              filter:
                organization:
                  org_members:
                    user_id: { _eq: X-Hasura-User-Id }
          - role: viewer
            permission:
              columns: [id, org_id, user_id, role, created_at]
              filter:
                organization:
                  org_members:
                    user_id: { _eq: X-Hasura-User-Id }
        insert_permissions:
          # Only owner can add/manage members — enforced via Action handler for member management
          - role: owner
            permission:
              columns: [org_id, user_id, role]
              check:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
        delete_permissions:
          - role: owner
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }

      # ─────────────────────────────────────────────────────────────
      # WORKFLOWS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: workflows
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
          - name: created_by_user
            using:
              foreign_key_constraint_on: created_by
        array_relationships:
          - name: workflow_steps
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_steps
          - name: workflow_triggers
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_triggers
          - name: workflow_runs
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_runs
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
          - role: editor
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    user_id: { _eq: X-Hasura-User-Id }
        insert_permissions:
          - role: owner
            permission:
              columns: [org_id, name, description, is_active, created_by]
              check:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
              set:
                created_by: X-Hasura-User-Id
          - role: editor
            permission:
              columns: [org_id, name, description, is_active, created_by]
              check:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _in: [owner, editor] }
              set:
                created_by: X-Hasura-User-Id
        update_permissions:
          - role: owner
            permission:
              columns: [name, description, is_active, updated_at]
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
              check: {}
          - role: editor
            permission:
              columns: [name, description, is_active, updated_at]
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _in: [owner, editor] }
              check: {}
        delete_permissions:
          - role: owner
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }

      # ─────────────────────────────────────────────────────────────
      # WORKFLOW STEPS — Layer 2a permissions enforced here
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: workflow_steps
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
          - role: editor
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id: { _eq: X-Hasura-User-Id }
        insert_permissions:
          # OWNER can insert any step type
          - role: owner
            permission:
              columns: [workflow_id, step_order, step_type, config]
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
          # EDITOR can only insert non-privileged step types (Layer 2a)
          - role: editor
            permission:
              columns: [workflow_id, step_order, step_type, config]
              check:
                _and:
                  - workflow:
                      organization:
                        org_members:
                          _and:
                            - user_id: { _eq: X-Hasura-User-Id }
                            - role: { _in: [owner, editor] }
                  - step_type:
                      _in: [llm_call, http_request, conditional_branch, approval_gate]
        update_permissions:
          - role: owner
            permission:
              columns: [step_order, step_type, config]
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
              check: {}
          - role: editor
            permission:
              columns: [step_order, config]
              filter:
                _and:
                  - workflow:
                      organization:
                        org_members:
                          _and:
                            - user_id: { _eq: X-Hasura-User-Id }
                            - role: { _in: [owner, editor] }
                  - step_type:
                      _in: [llm_call, http_request, conditional_branch, approval_gate]
              check: {}
        delete_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
          - role: editor
            permission:
              filter:
                _and:
                  - workflow:
                      organization:
                        org_members:
                          _and:
                            - user_id: { _eq: X-Hasura-User-Id }
                            - role: { _in: [owner, editor] }
                  - step_type:
                      _in: [llm_call, http_request, conditional_branch, approval_gate]

      # ─────────────────────────────────────────────────────────────
      # WORKFLOW TRIGGERS — Layer 2a: webhook/scheduled owner-only
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: workflow_triggers
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
          - role: editor
            permission:
              columns: [id, workflow_id, trigger_type, config, created_at]
              # editors can see manual trigger but NOT webhook_token
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: [id, workflow_id, trigger_type, created_at]
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id: { _eq: X-Hasura-User-Id }
        insert_permissions:
          # Owner can create any trigger type (Layer 2a)
          - role: owner
            permission:
              columns: [workflow_id, trigger_type, config]
              check:
                _and:
                  - workflow:
                      organization:
                        org_members:
                          _and:
                            - user_id: { _eq: X-Hasura-User-Id }
                            - role: { _eq: owner }
          # Editor can ONLY create manual triggers (Layer 2a)
          - role: editor
            permission:
              columns: [workflow_id, trigger_type, config]
              check:
                _and:
                  - workflow:
                      organization:
                        org_members:
                          _and:
                            - user_id: { _eq: X-Hasura-User-Id }
                            - role: { _in: [owner, editor] }
                  - trigger_type: { _eq: manual }
        delete_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }

      # ─────────────────────────────────────────────────────────────
      # WORKFLOW RUNS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: workflow_runs
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
          - name: triggered_by_user
            using:
              foreign_key_constraint_on: triggered_by
        array_relationships:
          - name: step_runs
            using:
              foreign_key_constraint_on:
                column: workflow_run_id
                table:
                  schema: public
                  name: step_runs
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
          - role: editor
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: "*"
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id: { _eq: X-Hasura-User-Id }

      # ─────────────────────────────────────────────────────────────
      # STEP RUNS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: step_runs
        object_relationships:
          - name: workflow_run
            using:
              foreign_key_constraint_on: workflow_run_id
          - name: workflow_step
            using:
              foreign_key_constraint_on: workflow_step_id
          - name: approver
            using:
              foreign_key_constraint_on: approved_by
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: owner }
          - role: editor
            permission:
              columns: "*"
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: "*"
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        user_id: { _eq: X-Hasura-User-Id }

      # ─────────────────────────────────────────────────────────────
      # RISK ASSESSMENTS
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: risk_assessments
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
          - name: workflow_run
            using:
              foreign_key_constraint_on: workflow_run_id
          - name: step_run
            using:
              foreign_key_constraint_on: step_run_id
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
          - role: editor
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _in: [owner, editor] }
          - role: viewer
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    user_id: { _eq: X-Hasura-User-Id }

      # ─────────────────────────────────────────────────────────────
      # ORG USAGE THIS MONTH VIEW
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: org_usage_this_month
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                org_id:
                  _eq: X-Hasura-Org-Id
          - role: editor
            permission:
              columns: [org_id, org_name, quota_calls_allowed, quota_calls_used, quota_calls_pending, runs_this_month, avg_run_duration_seconds]
              filter:
                org_id:
                  _eq: X-Hasura-Org-Id
          - role: viewer
            permission:
              columns: [org_id, org_name, quota_calls_allowed, quota_calls_used, runs_this_month]
              filter:
                org_id:
                  _eq: X-Hasura-Org-Id

      # ─────────────────────────────────────────────────────────────
      # WATCHED EVENTS (db_event trigger source)
      # ─────────────────────────────────────────────────────────────
      - table:
          schema: public
          name: watched_events
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
        select_permissions:
          - role: owner
            permission:
              columns: "*"
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }

actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run"

      output_type: TriggerWorkflowRunOutput
      arguments:
        - name: workflow_id
          type: uuid!
    comment: "Verifies membership, checks quota, creates run, executes steps"
    permissions:
      - role: owner
      - role: editor

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approve-step"

      output_type: ApproveStepOutput
      arguments:
        - name: step_run_id
          type: uuid!
    comment: "Layer 2b: Verifies approver role before resuming paused run"
    permissions:
      - role: owner
      - role: editor

  - name: webhookTriggerRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/webhook-trigger"
      output_type: TriggerWorkflowRunOutput
      arguments:
        - name: workflow_id
          type: uuid!
        - name: token
          type: String!
        - name: payload
          type: jsonb
    comment: "Public webhook endpoint — validates token, starts run"

custom_types:
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: success
          type: Boolean!
        - name: workflow_run_id
          type: uuid
        - name: message
          type: String
    - name: ApproveStepOutput
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String

event_triggers:
  - name: on_notify_step_run_status
    definition:
      enable_manual: false
      insert:
        columns: "*"
      update:
        columns: [status]
    comment: "Fires when a step_run with step_type=notify changes to running"
    table:
      schema: public
      name: step_runs
    webhook: "{{NHOST_FUNCTIONS_URL}}/notify-step"
    headers:
      - name: x-hasura-event-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    retry_conf:
      num_retries: 3
      interval_in_secs: 10
      timeout_in_secs: 60

  - name: on_watched_event_insert
    definition:
      enable_manual: false
      insert:
        columns: "*"
    comment: "Fires when a new watched_event row is inserted — starts a db_event workflow"
    table:
      schema: public
      name: watched_events
    webhook: "{{NHOST_FUNCTIONS_URL}}/db-event-trigger"
    retry_conf:
      num_retries: 3
      interval_in_secs: 10
      timeout_in_secs: 60

cron_triggers:
  - name: scheduled_workflow_runner
    webhook: "{{NHOST_FUNCTIONS_URL}}/scheduled-trigger"
    schedule: "* * * * *"
    include_in_metadata: true
    comment: "Checks every minute for scheduled workflow triggers and starts runs"
    headers:
      - name: x-hasura-cron-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    retry_conf:
      num_retries: 2
      interval_in_secs: 30
      timeout_in_secs: 60
